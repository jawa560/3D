<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迎曦門一萬步</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 版面：全幅 3D 畫布，左側一張「工程日誌」面板；窄螢幕時面板改為底部抽屜。 */
  :root {
    --bg: #d9e4ee;          /* 天空色，與畫布背景一致 */
    --panel: rgba(250, 247, 240, 0.86);
    --panel-solid: #faf7f0;
    --fg: #2b2420;
    --muted: #6f655c;
    --line: rgba(43, 36, 32, 0.14);
    --vermilion: #b3261e;   /* 柱、牆 */
    --cobalt: #2f5aa8;      /* 樑枋、封簷板 */
    --tile: #d4551c;        /* 屋瓦 */
    --sand: #cfbb90;        /* 砂岩 */
    --track: rgba(43, 36, 32, 0.10);
    --focus: #2f5aa8;
    --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1f28; --panel: rgba(28, 25, 23, 0.86); --panel-solid: #1c1917;
      --fg: #ece6dc; --muted: #a79d92; --line: rgba(236, 230, 220, 0.16);
      --vermilion: #d8483d; --cobalt: #6f93d8; --tile: #e8692f; --sand: #d8c7a2;
      --track: rgba(236, 230, 220, 0.12); --focus: #8fb0ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1f28; --panel: rgba(28, 25, 23, 0.86); --panel-solid: #1c1917;
    --fg: #ece6dc; --muted: #a79d92; --line: rgba(236, 230, 220, 0.16);
    --vermilion: #d8483d; --cobalt: #6f93d8; --tile: #e8692f; --sand: #d8c7a2;
    --track: rgba(236, 230, 220, 0.12); --focus: #8fb0ff; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }

  #panel {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 0; pointer-events: none;
    display: flex; flex-direction: column; width: min(372px, 100%); box-sizing: border-box;
  }
  .sheet {
    pointer-events: auto; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    display: flex; flex-direction: column; min-height: 0; max-height: 100%; overflow: hidden;
  }
  .head { position: relative; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .toggle { position: absolute; top: 10px; right: 10px; padding: 4px 10px; font-size: 12px; }
  .compact-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #panel.collapsed { width: min(320px, 100%); bottom: auto; }
  #panel.collapsed .full { display: none !important; }
  #panel.collapsed .head { padding: 10px 14px 8px; border-bottom: 0; }
  #panel.collapsed .readout { margin-top: 0; }
  #panel.collapsed .readout .n { font-size: 26px; }
  #panel.collapsed .chip { margin-top: 0; }
  #panel.collapsed .controls { border-bottom: 0; padding-top: 4px; padding-bottom: 12px; }
  #panel.collapsed .controls .row { flex-wrap: nowrap; }
  #panel.collapsed #slider { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
  h1 span { color: var(--vermilion); }
  .readout { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .readout .n { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1; color: var(--fg); }
  .readout .of { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 500; color: #fff; background: var(--vermilion); margin-top: 8px; }
  .desc { margin: 6px 0 0; min-height: 2.6em; color: var(--fg); }
  .desc small { display: block; color: var(--muted); }

  .progress { display: flex; height: 10px; border-radius: 2px; overflow: hidden; margin: 12px 0 0; background: var(--track); position: relative; }
  .progress i { display: block; height: 100%; opacity: 0.35; transition: opacity .2s; }
  .progress i.done { opacity: 1; }
  .progress .cursor { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--fg); left: 0; }

  .controls { padding: 12px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--vermilion); color: #fff; border-color: transparent; font-weight: 700; min-width: 86px; }
  button:hover, select:hover { border-color: var(--fg); }
  button:focus-visible, select:focus-visible, input:focus-visible, .steplist li:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  select { background: var(--panel-solid); }
  input[type=range] { width: 100%; accent-color: var(--vermilion); margin: 0; }
  label.sw { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .jump { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .jump input { width: 74px; font: inherit; font-variant-numeric: tabular-nums; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-solid); color: var(--fg); }

  .body { overflow: auto; min-height: 0; padding: 10px 18px 14px; }
  h2 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; font-weight: 500; }
  .phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .phases li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .phases li:hover { background: var(--track); }
  .phases li.cur { background: var(--track); font-weight: 700; }
  .phases li.done .nm { color: var(--muted); }
  .phases .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .phases .rg { font-size: 11px; color: var(--muted); }
  .phases .nm { font-size: 13px; }
  .steplist { list-style: none; margin: 0; padding: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .steplist li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 2px 6px; border-radius: 3px; cursor: pointer; color: var(--muted); }
  .steplist li b { font-weight: 500; }
  .steplist li.cur { background: var(--vermilion); color: #fff; }
  .steplist li.todo { opacity: 0.55; }
  .foot { padding: 10px 18px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .toast { color: var(--cobalt); }
  textarea.hidden-copy { position: absolute; left: -9999px; top: 0; }

  #hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 12px; color: var(--muted); background: var(--panel); padding: 6px 10px; border-radius: 4px; pointer-events: none; }
  #legend { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); font-size: 12px; color: var(--muted); background: var(--panel); padding: 8px 30px 8px 12px; border-radius: 4px; max-width: 220px; line-height: 1.5; }
  #legend .x { position: absolute; top: 4px; right: 4px; border: 0; background: transparent; padding: 2px 6px; font-size: 14px; line-height: 1; color: var(--muted); }
  #legend b { color: var(--fg); font-family: var(--font-display); }

  @media (max-width: 720px) {
    #panel, #panel.collapsed { top: auto; left: 0; right: 0; width: auto; bottom: 0; max-height: 52vh;
      padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sheet { border-radius: 8px 8px 0 0; }
    .head { padding: 12px 14px 8px; }
    h1 { font-size: 20px; }
    .readout .n { font-size: 28px; }
    .controls, .body, .foot { padding-left: 14px; padding-right: 14px; }
    #hint { display: none; }
    #legend { max-width: 60vw; }
    #panel.collapsed .sheet { border-radius: 8px 8px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="迎曦門 3D 建造動畫"></canvas></div>

<div id="legend"><button class="x" id="legendX" aria-label="關閉說明">×</button><b>迎曦門</b> 新竹東門城，建於 1829 年（道光九年）。砂岩城台、白色女牆、二重簷歇山頂，簷下懸白燈籠。以下模型為依照片推估的程序化重建。</div>

<aside id="panel">
  <div class="sheet">
    <div class="head">
      <button class="toggle" id="toggle" aria-expanded="true" aria-controls="panel">收合</button>
      <p class="eyebrow full">新竹東門城 · 迎曦門 · 程序化 3D</p>
      <h1 class="full">一萬步<span>建</span>城門</h1>
      <div class="compact-row"><div class="readout"><span class="n" id="stepN">0</span><span class="of">/ 10,000 步</span></div>
      <span class="chip" id="phaseChip">尚未開工</span></div>
      <p class="desc full" id="desc">按「開工」逐步建造，或拖曳進度條跳到任一步。<small id="phaseNote">每一步放上一個真實構件：石塊、磚、柱、瓦。</small></p>
      <div class="progress full" id="progress"><span class="cursor" id="cursor"></span></div>
    </div>
    <div class="controls">
      <div class="row">
        <button class="primary" id="play">開工</button>
        <select id="speed" class="full" aria-label="建造速度">
          <option value="12">12 步／秒</option>
          <option value="60">60 步／秒</option>
          <option value="300" selected>300 步／秒</option>
          <option value="1200">1,200 步／秒</option>
          <option value="4000">4,000 步／秒</option>
        </select>
        <button id="reset" class="full">重來</button>
        <button id="finish" class="full">完工</button>
        <button id="front" class="full">照片視角</button>
        <input type="range" id="slider" min="0" max="10000" value="0" step="1" aria-label="建造進度">
      </div>
      <div class="row full">
        <span class="jump">跳到第 <input type="number" id="jump" min="0" max="10000" value="0"> 步</span>
        <label class="sw"><input type="checkbox" id="spin" checked> 自動旋轉</label>
        <label class="sw"><input type="checkbox" id="shadow" checked> 陰影</label>
      </div>
    </div>
    <div class="body full">
      <h2>施工階段（點擊跳轉）</h2>
      <ol class="phases" id="phases"></ol>
      <h2>步驟清單（目前位置前後）</h2>
      <ul class="steplist" id="steplist"></ul>
    </div>
    <div class="foot full">
      <button id="copy">複製全部 10,000 步（CSV）</button>
      <span class="toast" id="toast"></span>
    </div>
  </div>
</aside>
<div id="hint">拖曳旋轉 · 雙指或右鍵拖曳平移 · 滾輪／捏合縮放</div>
<textarea class="hidden-copy" id="copyArea" aria-hidden="true" tabindex="-1"></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="gate-steps.js"></script>
<script>
(function () {
  'use strict';
  var MODEL = GateModel.build();
  var STEPS = MODEL.steps, N = MODEL.total, PHASES = MODEL.phases;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 畫面 ----------
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcfdde9, 90, 260);
  var camera = new THREE.PerspectiveCamera(42, 1, 0.5, 600);

  // 天空
  var sky = new THREE.Mesh(new THREE.SphereGeometry(400, 24, 12), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x5f8fcf) }, mid: { value: new THREE.Color(0xbcd6ef) }, bot: { value: new THREE.Color(0xe6e9e4) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top, mid, bot; varying vec3 vP; void main(){ float h = clamp(vP.y, -0.1, 1.0); vec3 c = h < 0.25 ? mix(bot, mid, smoothstep(-0.1, 0.25, h)) : mix(mid, top, smoothstep(0.25, 1.0, h)); gl_FragColor = vec4(c, 1.0); }'
  }));
  scene.add(sky);

  var hemi = new THREE.HemisphereLight(0xdfeaff, 0x8a7a60, 0.6);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1dc, 1.35);
  sun.position.set(30, 48, 26);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -44; sun.shadow.camera.right = 44; sun.shadow.camera.top = 44; sun.shadow.camera.bottom = -44;
  sun.shadow.camera.near = 5; sun.shadow.camera.far = 160;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
  scene.add(sun);

  var ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: new THREE.Color(0x6f6f69).convertSRGBToLinear(), roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true;
  scene.add(ground);
  // 馬路（前方）
  var road = new THREE.Mesh(new THREE.PlaneGeometry(500, 14), new THREE.MeshStandardMaterial({ color: new THREE.Color(0x4f5054).convertSRGBToLinear(), roughness: 1 }));
  road.rotation.x = -Math.PI / 2; road.position.set(0, -0.01, 24); road.receiveShadow = true;
  scene.add(road);

  // ---------- 實例化構件 ----------
  var geoms = [new THREE.BoxGeometry(1, 1, 1), new THREE.CylinderGeometry(0.5, 0.5, 1, 14), new THREE.SphereGeometry(0.5, 12, 10)];
  var mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0.0 });
  var groups = [];
  var counts = [0, 0, 0];
  STEPS.forEach(function (s) { if (s.g < 3) counts[s.g]++; });
  var tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpP = new THREE.Vector3(), tmpS = new THREE.Vector3();
  var xAxis = new THREE.Vector3(1, 0, 0), dirV = new THREE.Vector3(), col = new THREE.Color();
  for (var g = 0; g < 3; g++) {
    var mesh = new THREE.InstancedMesh(geoms[g], mat, Math.max(1, counts[g]));
    mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
    groups.push({ mesh: mesh, stepIdx: new Int32Array(counts[g]), base: new Float32Array(counts[g] * 16), fill: 0 });
    scene.add(mesh);
  }
  var stepToSlot = new Int32Array(N); // 每一步對應其群組內的索引
  var plaque = null;
  STEPS.forEach(function (s, k) {
    if (s.g === 3) { plaque = makePlaque(s); stepToSlot[k] = -1; return; }
    var G = groups[s.g], i = G.fill++;
    if (s.dir) { dirV.set(s.dir[0], s.dir[1], s.dir[2]).normalize(); tmpQ.setFromUnitVectors(xAxis, dirV); }
    else { tmpE.set(s.rx, s.ry, s.rz, 'YXZ'); tmpQ.setFromEuler(tmpE); }
    tmpM.compose(tmpP.set(s.x, s.y, s.z), tmpQ, tmpS.set(s.sx, s.sy, s.sz));
    G.base.set(tmpM.elements, i * 16);
    G.mesh.setMatrixAt(i, tmpM);
    col.setHex(s.c).convertSRGBToLinear();
    G.mesh.setColorAt(i, col);
    G.stepIdx[i] = k;
    stepToSlot[k] = i;
  });
  // 顏色緩衝區依建立時的 count 配置，所以要先寫入顏色，再把顯示數量歸零。
  groups.forEach(function (G) { G.mesh.instanceMatrix.needsUpdate = true; if (G.mesh.instanceColor) G.mesh.instanceColor.needsUpdate = true; G.mesh.count = 0; });

  function makePlaque(s) {
    var cv = document.createElement('canvas'); cv.width = 512; cv.height = 216;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#1d1512'; ctx.fillRect(0, 0, 512, 216);
    ctx.strokeStyle = '#d9a521'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, 498, 202);
    ctx.fillStyle = '#e8c35a'; ctx.font = '700 150px "Noto Serif TC", "Songti TC", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('迎曦門', 256, 118);
    var tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
    var mats = [];
    for (var f = 0; f < 6; f++) mats.push(new THREE.MeshStandardMaterial({ color: new THREE.Color(0x1d1512).convertSRGBToLinear(), roughness: 0.7 }));
    mats[4] = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
    var m = new THREE.Mesh(new THREE.BoxGeometry(s.sx, s.sy, s.sz), mats);
    m.position.set(s.x, s.y, s.z); m.castShadow = true; m.visible = false;
    scene.add(m);
    return { mesh: m, step: s.n };
  }

  // 完工標記（最新放上的構件）
  var marker = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 }));
  marker.visible = false; scene.add(marker);

  // ---------- 進度控制 ----------
  var S = 0, playing = false, acc = 0, anims = [];
  function upperBound(arr, v) { var lo = 0, hi = arr.length; while (lo < hi) { var m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; } return lo; }
  function applyCounts() {
    groups.forEach(function (G) { G.mesh.count = upperBound(G.stepIdx, S); });
    if (plaque) plaque.mesh.visible = S >= plaque.step;
  }
  function setStep(next, animate) {
    next = Math.max(0, Math.min(N, Math.round(next)));
    var prev = S; S = next;
    if (animate && !reduced && S > prev) {
      var start = Math.max(prev, S - 300), now = performance.now();
      for (var k = start; k < S; k++) {
        var s = STEPS[k];
        if (s.g === 3) continue;
        anims.push({ G: groups[s.g], i: stepToSlot[k], t0: now + (k - start) * (120 / Math.max(1, S - start)) });
      }
    } else if (S < prev || !animate) {
      anims.forEach(function (a) { restore(a); }); anims.length = 0;
    }
    applyCounts();
    updateUI();
  }
  function restore(a) {
    a.G.mesh.instanceMatrix.array.set(a.G.base.subarray(a.i * 16, a.i * 16 + 16), a.i * 16);
    a.G.mesh.instanceMatrix.needsUpdate = true;
  }
  function tickAnims(now) {
    if (!anims.length) return;
    var keep = [];
    for (var n = 0; n < anims.length; n++) {
      var a = anims[n], t = (now - a.t0) / 420;
      var arr = a.G.mesh.instanceMatrix.array, off = a.i * 16;
      if (t >= 1) { arr.set(a.G.base.subarray(off, off + 16), off); }
      else {
        var tt = Math.max(0, t), e = 1 - Math.pow(1 - tt, 3);
        arr.set(a.G.base.subarray(off, off + 16), off);
        arr[off + 13] = a.G.base[off + 13] + (1 - e) * 2.4;
        keep.push(a);
      }
      a.G.mesh.instanceMatrix.needsUpdate = true;
    }
    anims = keep;
  }

  // ---------- UI ----------
  var el = function (id) { return document.getElementById(id); };
  var stepN = el('stepN'), phaseChip = el('phaseChip'), desc = el('desc'), phaseNote = el('phaseNote'), slider = el('slider'), jump = el('jump');
  var playBtn = el('play'), progress = el('progress'), cursor = el('cursor'), phasesEl = el('phases'), steplist = el('steplist'), toast = el('toast');
  var phaseColors = ['#cfbb90', '#b9a67c', '#bbb09a', '#e6e0d2', '#d6cfbf', '#b3261e', '#2f5aa8', '#8a2b1f', '#d4551c', '#a8281f', '#e8692f', '#7c8691', '#9d9c95'];
  var segEls = [];
  PHASES.forEach(function (p, i) {
    var seg = document.createElement('i'); seg.style.width = (p.count / N * 100) + '%'; seg.style.background = phaseColors[i];
    progress.insertBefore(seg, cursor); segEls.push(seg);
    var li = document.createElement('li'); li.tabIndex = 0;
    li.innerHTML = '<span class="sw" style="background:' + phaseColors[i] + '"></span><span class="nm">' + (i + 1) + '. ' + p.name + '</span><span class="rg">' + p.from.toLocaleString() + '–' + p.to.toLocaleString() + '</span>';
    li.title = p.note;
    li.addEventListener('click', function () { pause(); setStep(p.from, false); });
    li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pause(); setStep(p.from, false); } });
    phasesEl.appendChild(li);
  });
  function phaseOf(step) { if (step <= 0) return -1; var s = STEPS[step - 1]; return s.ph; }
  var lastListKey = -1;
  function updateUI() {
    stepN.textContent = S.toLocaleString();
    slider.value = S; if (document.activeElement !== jump) jump.value = S;
    var ph = phaseOf(S);
    if (S === 0) { phaseChip.textContent = '尚未開工'; phaseChip.style.background = 'var(--muted)'; desc.firstChild.textContent = '按「開工」逐步建造，或拖曳進度條跳到任一步。'; phaseNote.textContent = '每一步放上一個真實構件：石塊、磚、柱、瓦。'; }
    else {
      var p = PHASES[ph], s = STEPS[S - 1];
      phaseChip.textContent = '第 ' + (ph + 1) + ' 階段 · ' + p.name + (S === N ? ' · 完工' : '');
      phaseChip.style.background = S === N ? 'var(--cobalt)' : 'var(--vermilion)';
      desc.firstChild.textContent = '第 ' + S.toLocaleString() + ' 步：' + s.d;
      phaseNote.textContent = p.note + '（本階段 ' + (S - p.from + 1).toLocaleString() + ' / ' + p.count.toLocaleString() + '）';
    }
    cursor.style.left = (S / N * 100) + '%';
    segEls.forEach(function (seg, i) { seg.classList.toggle('done', S >= PHASES[i].to); seg.style.opacity = S >= PHASES[i].to ? 1 : (S >= PHASES[i].from ? 0.7 : 0.3); });
    Array.prototype.forEach.call(phasesEl.children, function (li, i) { li.classList.toggle('cur', i === ph); li.classList.toggle('done', S >= PHASES[i].to); });
    playBtn.textContent = playing ? '暫停' : (S >= N ? '已完工' : (S > 0 ? '繼續' : '開工'));
    var key = Math.floor(S / 8);
    if (key !== lastListKey || S === N) { lastListKey = key; renderList(); }
    else Array.prototype.forEach.call(steplist.children, function (li) { var n = +li.dataset.n; li.classList.toggle('cur', n === S); li.classList.toggle('todo', n > S); });
    if (S > 0) { var ls = STEPS[S - 1]; marker.position.set(ls.x, ls.y + 0.6, ls.z); marker.visible = true; } else marker.visible = false;
  }
  function renderList() {
    var from = Math.max(1, Math.floor(S / 8) * 8 - 8), to = Math.min(N, from + 23);
    var html = '';
    for (var k = from; k <= to; k++) {
      var s = STEPS[k - 1];
      html += '<li data-n="' + k + '" class="' + (k === S ? 'cur' : (k > S ? 'todo' : '')) + '" tabindex="0"><b>#' + k.toLocaleString() + '</b><span>' + s.d + '</span></li>';
    }
    steplist.innerHTML = html;
  }
  steplist.addEventListener('click', function (ev) { var li = ev.target.closest('li'); if (li) { pause(); setStep(+li.dataset.n, false); } });
  steplist.addEventListener('keydown', function (ev) { var li = ev.target.closest('li'); if (li && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); pause(); setStep(+li.dataset.n, false); } });

  function play() { if (S >= N) setStep(0, false); playing = true; acc = 0; updateUI(); }
  function pause() { playing = false; updateUI(); }
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  el('reset').addEventListener('click', function () { pause(); setStep(0, false); });
  el('finish').addEventListener('click', function () { pause(); setStep(N, false); });
  // 與原照片相同的角度：站在馬路對面、略偏右、由低處仰望
  el('front').addEventListener('click', function () { spinBox.checked = false; cam.theta = 0.12; cam.phi = 1.47; cam.r = fitR(50); target.set(0, 8, 0); });
  slider.addEventListener('input', function () { pause(); setStep(+slider.value, false); });
  jump.addEventListener('change', function () { pause(); setStep(+jump.value || 0, false); });
  var spinBox = el('spin'), shadowBox = el('shadow');
  if (reduced) spinBox.checked = false;
  if (window.innerWidth < 720) { shadowBox.checked = false; }
  shadowBox.addEventListener('change', function () { renderer.shadowMap.enabled = shadowBox.checked; mat.needsUpdate = true; });
  renderer.shadowMap.enabled = shadowBox.checked;

  el('copy').addEventListener('click', function () {
    var lines = ['步驟,階段編號,階段,說明,x,y,z,長,高,寬'];
    for (var k = 0; k < N; k++) {
      var s = STEPS[k];
      lines.push([s.n, s.ph + 1, PHASES[s.ph].name, '"' + s.d + '"', s.x.toFixed(2), s.y.toFixed(2), s.z.toFixed(2), s.sx.toFixed(2), s.sy.toFixed(2), s.sz.toFixed(2)].join(','));
    }
    var text = lines.join('\n');
    function ok() { toast.textContent = '已複製 10,000 行到剪貼簿'; setTimeout(function () { toast.textContent = ''; }, 2500); }
    function fallback() {
      var ta = el('copyArea'); ta.value = text; ta.style.left = '0'; ta.focus(); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { toast.textContent = '無法自動複製，請於文字框手動複製'; }
      setTimeout(function () { ta.style.left = '-9999px'; }, 3000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  });

  // ---------- 面板收合 ----------
  var panelEl = el('panel'), sheetEl = panelEl.querySelector('.sheet'), toggleBtn = el('toggle');
  function setCollapsed(c) {
    panelEl.classList.toggle('collapsed', c);
    toggleBtn.textContent = c ? '展開' : '收合';
    toggleBtn.setAttribute('aria-expanded', String(!c));
    try { localStorage.setItem('gate-panel-collapsed', c ? '1' : '0'); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('gate-panel-collapsed'); } catch (e) {}
  setCollapsed(saved === null ? window.innerWidth <= 720 : saved === '1');
  toggleBtn.addEventListener('click', function () { setCollapsed(!panelEl.classList.contains('collapsed')); });
  el('legendX').addEventListener('click', function () { el('legend').hidden = true; });
  if (window.innerWidth <= 720) el('legend').hidden = true;

  // ---------- 相機（軌道、平移、縮放） ----------
  var target = new THREE.Vector3(0, 8.5, 0);
  var cam = { r: 54, theta: -0.62, phi: 1.22 };
  var mode = null, lastX = 0, lastY = 0, pinchD = 0, midX = 0, midY = 0;
  var vRight = new THREE.Vector3(), vUp = new THREE.Vector3();
  function orbit(dx, dy) {
    cam.theta -= dx * 0.006;
    cam.phi = Math.max(0.18, Math.min(1.52, cam.phi - dy * 0.004));
  }
  function pan(dx, dy) {
    // 每像素對應的世界長度：以目前距離與視角換算，讓拖曳時城門跟著手指走
    var h = canvas.clientHeight || 1;
    var k = 2 * cam.r * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / h;
    camera.updateMatrixWorld();
    vRight.setFromMatrixColumn(camera.matrixWorld, 0);
    vUp.setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(vRight, -dx * k).addScaledVector(vUp, dy * k);
    target.x = Math.max(-60, Math.min(60, target.x));
    target.z = Math.max(-60, Math.min(60, target.z));
    target.y = Math.max(0, Math.min(30, target.y));
  }
  function zoom(f) { cam.r = Math.max(10, Math.min(160, cam.r * f)); }
  // 直式螢幕水平視角窄：拉遠到能放下整座城門（含簷口約 26 m 寬）
  function fitR(base) {
    var a = (canvas.clientWidth || 1) / (canvas.clientHeight || 1);
    var t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    return Math.min(150, Math.max(base, 15 / (t * a)));
  }
  cam.r = fitR(cam.r);

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('mousedown', function (e) {
    mode = (e.button === 2 || e.button === 1 || e.shiftKey) ? 'pan' : 'orbit';
    lastX = e.clientX; lastY = e.clientY; e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (!mode) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (mode === 'pan') pan(dx, dy); else orbit(dx, dy);
  });
  window.addEventListener('mouseup', function () { mode = null; });
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); zoom(Math.pow(1.0015, e.deltaY)); }, { passive: false });

  function touchMid(t) { return [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2]; }
  function touchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function touchBegin(e) {
    if (e.touches.length === 1) { mode = 'orbit'; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
    else if (e.touches.length >= 2) { mode = 'pinch'; pinchD = touchDist(e.touches); var m = touchMid(e.touches); midX = m[0]; midY = m[1]; }
    else mode = null;
  }
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); touchBegin(e); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (mode === 'orbit' && e.touches.length === 1) {
      var t = e.touches[0];
      orbit(t.clientX - lastX, t.clientY - lastY);
      lastX = t.clientX; lastY = t.clientY;
    } else if (mode === 'pinch' && e.touches.length >= 2) {
      // 雙指：中點移動 = 平移，兩指距離變化 = 縮放
      var d = touchDist(e.touches), m = touchMid(e.touches);
      if (pinchD > 0 && d > 0) zoom(pinchD / d);
      pan(m[0] - midX, m[1] - midY);
      pinchD = d; midX = m[0]; midY = m[1];
    }
  }, { passive: false });
  // 手指數改變時重新取基準，避免視角跳動
  canvas.addEventListener('touchend', function (e) { touchBegin(e); }, { passive: true });
  canvas.addEventListener('touchcancel', function (e) { touchBegin(e); }, { passive: true });

  // 讓城門落在面板以外的可見區中央：以 setViewOffset 平移投影中心
  var offCur = { x: 0, y: 0 }, offGoal = { x: 0, y: 0 }, lastW = 0, lastH = 0;
  function updateOffsetGoal() {
    var w = canvas.clientWidth, h = canvas.clientHeight, r = sheetEl.getBoundingClientRect();
    if (window.innerWidth <= 720) { offGoal.x = 0; offGoal.y = Math.max(0, h - r.top) / 2; }
    else { offGoal.x = r.height > h * 0.6 ? -Math.max(0, r.right) / 2 : 0; offGoal.y = 0; }
  }
  function resize(dt) {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var pr = renderer.getPixelRatio();
    if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) renderer.setSize(w, h, false);
    updateOffsetGoal();
    var k = reduced ? 1 : Math.min(1, (dt || 0.016) * 8);
    offCur.x += (offGoal.x - offCur.x) * k; offCur.y += (offGoal.y - offCur.y) * k;
    if (w !== lastW || h !== lastH || Math.abs(offGoal.x - offCur.x) > 0.01 || Math.abs(offGoal.y - offCur.y) > 0.01 || !camera.view) {
      camera.aspect = w / h;
      camera.setViewOffset(w, h, offCur.x, offCur.y, w, h);
      lastW = w; lastH = h;
    }
  }

  // 熱更新：保留目前進度
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(function () { return { S: S, playing: playing }; }); } catch (e) {}
  }
  function start(data) {
    if (data && typeof data.S === 'number') { setStep(data.S, false); playing = !!data.playing; }
    else setStep(0, false);
    var last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(0.1, (now - last) / 1000); last = now;
      resize(dt);
      if (playing) {
        acc += dt * (+el('speed').value);
        var adv = Math.floor(acc);
        if (adv > 0) { acc -= adv; setStep(S + adv, true); if (S >= N) pause(); }
      }
      tickAnims(now);
      if (spinBox.checked && !mode && !reduced) cam.theta += dt * 0.07;
      camera.position.set(target.x + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta), target.y + cam.r * Math.cos(cam.phi), target.z + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta));
      camera.lookAt(target);
      sky.position.copy(camera.position);
      marker.material.opacity = 0.55 + 0.35 * Math.sin(now / 180);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
