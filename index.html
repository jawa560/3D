<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新竹迎曦門 3D</title>
<style>
  :root { --panel: rgba(255,255,255,.82); --ink: #2a2622; --accent: #b3261e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4ec; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink); }
  canvas { display: block; }
  #panel { position: fixed; left: 16px; top: 16px; max-width: calc(100vw - 32px); background: var(--panel); backdrop-filter: blur(6px); border-radius: 12px; padding: 12px 16px; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
  #panel h1 { margin: 0 0 4px; font-size: 18px; }
  #panel p { margin: 0 0 8px; font-size: 13px; opacity: .8; }
  #panel button { font: inherit; font-size: 13px; border: 1px solid #0002; background: #fff; border-radius: 8px; padding: 5px 10px; margin: 2px 4px 2px 0; cursor: pointer; }
  #panel button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1>新竹迎曦門（東門城）</h1>
  <p>拖曳旋轉・滾輪縮放・右鍵平移</p>
  <button id="btnRotate">自動旋轉</button>
  <button id="btnPhoto">照片視角</button>
  <button id="btnTop">俯瞰</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 * 0. 場景、相機、渲染器、光源
 *    目的：建立一個有天空、陽光與陰影的基礎舞台
 * ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfd8ef, 90, 260);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8;
controls.maxDistance = 140;

// 天空：漸層球
{
  const geo = new THREE.SphereGeometry(500, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x2f7fd6) }, bottom: { value: new THREE.Color(0xd6e8f7) } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
      void main(){ float t = clamp(vP.y*1.6, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(t,0.7)), 1.0); }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}
// 雲：幾團半透明的球
{
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xb8c4d0, transparent: true, opacity: 0.92, fog: false });
  const rnd = mulberry32(7);
  for (let c = 0; c < 14; c++) {
    const g = new THREE.Group();
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 120;
    g.position.set(Math.cos(ang) * dist, 55 + rnd() * 60, Math.sin(ang) * dist);
    for (let k = 0; k < 7; k++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(8 + rnd() * 10, 12, 8), cloudMat);
      m.position.set((rnd() - .5) * 40, (rnd() - .3) * 6, (rnd() - .5) * 18);
      m.scale.y = 0.55;
      g.add(m);
    }
    g.lookAt(0, g.position.y, 0);
    scene.add(g);
  }
}

scene.add(new THREE.HemisphereLight(0xdcebff, 0x8a7a66, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
sun.position.set(-35, 55, 45);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -35, right: 35, top: 35, bottom: -35, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

/* ============================================================
 * 小工具：亂數、貼圖、mesh 建立
 * ============================================================ */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function std(opts) { return new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0, ...opts }); }
function add(mesh, parent = scene, cast = true, receive = true) { mesh.castShadow = cast; mesh.receiveShadow = receive; parent.add(mesh); return mesh; }
function box(w, h, d, mat, x, y, z, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return add(m, parent); }

/* ---------- 貼圖 ---------- */
// 砂岩磚：1 張貼圖 = 4m × 4m，每塊磚 0.5m × 0.25m
const stoneTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = mulberry32(3);
  g.fillStyle = '#d9c9ab'; g.fillRect(0, 0, w, h);               // 灰縫
  const bw = 64, bh = 32;
  for (let r = 0; r < h / bh; r++) {
    const off = (r % 2) * bw / 2;
    for (let c = -1; c < w / bw + 1; c++) {
      const v = rnd();
      const l = 58 + v * 14;
      g.fillStyle = `hsl(${32 + rnd() * 6}, ${26 + rnd() * 10}%, ${l}%)`;
      g.fillRect(c * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
      g.fillStyle = `rgba(0,0,0,${rnd() * 0.08})`;
      g.fillRect(c * bw + off + 2, r * bh + bh * 0.55, bw - 4, bh * 0.45 - 2);
    }
  }
});
stoneTex.repeat.set(0.25, 0.25);

// 屋瓦：筒瓦溝槽，沿 u 方向排列（1 張 = 2m）
const tileTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b8461f'; g.fillRect(0, 0, w, h);
  const n = 8, cw = w / n;
  for (let i = 0; i < n; i++) {
    const grd = g.createLinearGradient(i * cw, 0, (i + 1) * cw, 0);
    grd.addColorStop(0, '#7e2c14'); grd.addColorStop(0.25, '#d0612e');
    grd.addColorStop(0.5, '#e47a3e'); grd.addColorStop(0.75, '#c4552a'); grd.addColorStop(1, '#7e2c14');
    g.fillStyle = grd; g.fillRect(i * cw + cw * 0.15, 0, cw * 0.7, h);
  }
  g.fillStyle = 'rgba(60,20,8,0.35)';
  for (let j = 0; j < 4; j++) g.fillRect(0, j * h / 4, w, 3);
});

// 彩繪橫樑
const beamTex = canvasTex(512, 64, (g, w, h) => {
  g.fillStyle = '#244f86'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2f8a6a'; g.fillRect(0, h * 0.2, w, h * 0.6);
  for (let i = 0; i < 8; i++) {
    const x = i * w / 8;
    g.fillStyle = '#e0b040'; g.fillRect(x, 0, 6, h);
    g.fillStyle = '#c83a28'; g.beginPath(); g.ellipse(x + w / 16, h / 2, w / 26, h * 0.32, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#f3e6c0'; g.lineWidth = 3; g.stroke();
  }
  g.fillStyle = '#e0b040'; g.fillRect(0, 0, w, 4); g.fillRect(0, h - 4, w, 4);
});

// 牆面：red/white 底、柱框、窗格
function wallTex({ bays, base, post, win, lattice, winH = [0.3, 0.75], winW = 0.55, door = false }) {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const bw = w / bays;
    for (let i = 0; i < bays; i++) {
      const cx = i * bw + bw / 2;
      const ww = bw * (door && i === Math.floor(bays / 2) ? 0.8 : winW);
      const y0 = h * (door && i === Math.floor(bays / 2) ? 0.15 : winH[0]);
      const y1 = h * winH[1];
      g.fillStyle = win; g.fillRect(cx - ww / 2, h - y1, ww, y1 - y0);
      g.strokeStyle = lattice; g.lineWidth = 3;
      for (let k = 1; k < 6; k++) { const x = cx - ww / 2 + ww * k / 6; g.beginPath(); g.moveTo(x, h - y1); g.lineTo(x, h - y0); g.stroke(); }
      for (let k = 1; k < 5; k++) { const y = h - y1 + (y1 - y0) * k / 5; g.beginPath(); g.moveTo(cx - ww / 2, y); g.lineTo(cx + ww / 2, y); g.stroke(); }
      g.strokeStyle = post; g.lineWidth = 8; g.strokeRect(cx - ww / 2, h - y1, ww, y1 - y0);
      g.fillStyle = post; g.fillRect(i * bw - 8, 0, 16, h);
    }
    g.fillStyle = post; g.fillRect(0, 0, w, 18);
  }, false);
}

/* ============================================================
 * 1. 城台（磚砌台座 + 拱門通道 + 白色壓簷）
 *    目的：做出照片下半部最顯眼的砂岩城台
 * ============================================================ */
const gate = new THREE.Group();
scene.add(gate);

const P = { W: 18, D: 15, H: 8, archW: 4.8, archSpring: 3.9, taper: 0.035 };
{
  // 以「正面輪廓」(含拱門缺口) 擠出成實體
  const s = new THREE.Shape();
  const hw = P.W / 2, aw = P.archW / 2;
  s.moveTo(-hw, 0); s.lineTo(-aw, 0); s.lineTo(-aw, P.archSpring);
  s.absarc(0, P.archSpring, aw, Math.PI, 0, true);
  s.lineTo(aw, 0); s.lineTo(hw, 0); s.lineTo(hw, P.H); s.lineTo(-hw, P.H); s.closePath();

  // 自訂 UV：讓磚紋在每一面都保持水平、以公尺為單位
  const uvGen = {
    generateTopUV(g, v, a, b, c) { return [a, b, c].map(i => new THREE.Vector2(v[i * 3], v[i * 3 + 1])); },
    generateSideWallUV(g, v, a, b, c, d) {
      const P3 = i => [v[i * 3], v[i * 3 + 1], v[i * 3 + 2]];
      const [A, B, C, D] = [a, b, c, d].map(P3);
      const horiz = Math.abs(A[1] - B[1]) < Math.abs(A[0] - B[0]);
      return [A, B, C, D].map(p => horiz ? new THREE.Vector2(p[0], p[2]) : new THREE.Vector2(p[2], p[1]));
    }
  };
  const geo = new THREE.ExtrudeGeometry(s, { depth: P.D, bevelEnabled: false, curveSegments: 32, UVGenerator: uvGen });
  geo.translate(0, 0, -P.D / 2);
  // 收分：越往上越窄
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const k = 1 - P.taper * pos.getY(i) / P.H;
    pos.setX(i, pos.getX(i) * k); pos.setZ(i, pos.getZ(i) * k);
  }
  geo.computeVertexNormals();
  add(new THREE.Mesh(geo, std({ map: stoneTex, roughness: 0.95 })), gate);

  // 通道內部稍暗的地面
  box(P.archW, 0.05, P.D, std({ color: 0x6f6458 }), 0, 0.03, 0, gate);

  // 頂部白色壓簷（兩層）
  const white = std({ color: 0xefeadf, roughness: 0.7 });
  const topW = P.W * (1 - P.taper), topD = P.D * (1 - P.taper);
  box(topW + 0.6, 0.35, topD + 0.6, white, 0, P.H + 0.175, 0, gate);
  box(topW + 0.2, 0.3, topD + 0.2, white, 0, P.H - 0.15, 0, gate);
}

/* ============================================================
 * 2. 曲面屋頂產生器
 *    目的：用一個「高度函數」做出中式屋頂的凹曲面與四角起翹，
 *          同一函數可產生廡殿式腰檐與歇山頂
 * ============================================================ */
const curve = s => 0.3 * s + 0.7 * s * s;          // 凹曲線：簷口平緩、近脊陡
function roofY(x, z, p) {
  const ax = Math.abs(x), az = Math.abs(z);
  const sy = (p.B - az) / p.B;                       // 前後坡的「離簷口距離」
  const sx = (p.A - ax) / p.B;                       // 兩端坡
  let s, region = 'side';
  if (p.gable != null && sx > p.gable) s = sy;      // 歇山：超過山花線就只剩前後坡
  else if (sx < sy) { s = sx; region = 'end'; } else s = sy;
  s = Math.min(Math.max(s, 0), 1);
  const lift = p.L * Math.pow(ax / p.A, 4) * Math.pow(az / p.B, 4) * Math.pow(1 - s, 2); // 起翹
  return { y: p.y0 + p.H * curve(s) + lift, s, region };
}

const tileMat = std({ map: tileTex, roughness: 0.75 });
const underMat = std({ color: 0x5a2016, side: THREE.BackSide });
const gableMat = std({ color: 0xa8321e, side: THREE.DoubleSide });
const ridgeMat = std({ color: 0x2d4fa0, roughness: 0.5 });
const fasciaMat = std({ color: 0x7a2616, side: THREE.DoubleSide });

function buildRoof(p, cut = () => false) {
  const NX = 160, NZ = Math.round(NX * p.B / p.A);
  const grid = [];
  for (let i = 0; i <= NX; i++) {
    grid[i] = [];
    for (let j = 0; j <= NZ; j++) {
      const x = -p.A + 2 * p.A * i / NX, z = -p.B + 2 * p.B * j / NZ;
      grid[i][j] = new THREE.Vector3(x, roofY(x, z, p).y, z);
    }
  }
  const tPos = [], tUv = [], gPos = [];
  const n = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  const pushTri = (a, b, c) => {
    const cx = (a.x + b.x + c.x) / 3, cz = (a.z + b.z + c.z) / 3;
    if (cut(cx, cz)) return;
    e1.subVectors(b, a); e2.subVectors(c, a); n.crossVectors(e1, e2).normalize();
    if (n.y < 0) { [b, c] = [c, b]; n.negate(); }
    if (n.y < 0.3) { gPos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z); return; } // 陡面 = 山花
    const reg = roofY(cx, cz, p).region;
    tPos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    for (const v of [a, b, c]) reg === 'side' ? tUv.push(v.x / 2, v.z / 2) : tUv.push(v.z / 2, v.x / 2);
  };
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ; j++) {
    const a = grid[i][j], b = grid[i + 1][j], c = grid[i + 1][j + 1], d = grid[i][j + 1];
    pushTri(a, b, c); pushTri(a, c, d);
  }
  const g = new THREE.Group();
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
  tg.setAttribute('uv', new THREE.Float32BufferAttribute(tUv, 2));
  tg.computeVertexNormals();
  add(new THREE.Mesh(tg, tileMat), g);
  add(new THREE.Mesh(tg, underMat), g);                   // 屋簷底面（深紅）
  if (gPos.length) {
    const gg = new THREE.BufferGeometry();
    gg.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
    gg.computeVertexNormals();
    add(new THREE.Mesh(gg, gableMat), g);
  }

  // 簷口封簷板
  const edge = [];
  const S = 60;
  const corners = [[-p.A, -p.B], [p.A, -p.B], [p.A, p.B], [-p.A, p.B]];
  for (let k = 0; k < 4; k++) {
    const [x0, z0] = corners[k], [x1, z1] = corners[(k + 1) % 4];
    for (let t = 0; t < S; t++) { const x = x0 + (x1 - x0) * t / S, z = z0 + (z1 - z0) * t / S; edge.push(new THREE.Vector3(x, roofY(x, z, p).y, z)); }
  }
  edge.push(edge[0].clone());
  const fp = [];
  for (let k = 0; k < edge.length - 1; k++) {
    const a = edge[k], b = edge[k + 1];
    fp.push(a.x, a.y, a.z, b.x, b.y, b.z, b.x, b.y - 0.28, b.z, a.x, a.y, a.z, b.x, b.y - 0.28, b.z, a.x, a.y - 0.28, a.z);
  }
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.Float32BufferAttribute(fp, 3));
  fg.computeVertexNormals();
  add(new THREE.Mesh(fg, fasciaMat), g);
  // 簷口白色瓦當線
  add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edge, true), 400, 0.07, 6, true), std({ color: 0xf0e2c8 })), g);

  // 屋脊（藍色）
  const ridge = (pts, r = 0.14) => add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, r, 8, false), ridgeMat), g);
  const ridgeEndX = p.gable != null ? p.A - p.gable * p.B : p.A - p.B;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    // 戧脊：從角落沿 45° 往上
    const pts = [];
    const tEnd = p.gable != null ? p.gable : 1;
    for (let t = 0; t <= tEnd + 1e-6; t += tEnd / 24) {
      const x = sx * (p.A - t * p.B), z = sz * (p.B - t * p.B);
      if (cut(x, z)) break;
      pts.push(new THREE.Vector3(x, roofY(x, z, p).y + 0.1, z));
    }
    if (pts.length > 1) ridge(pts);
    // 翹角尖端
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.0, 8), ridgeMat);
    tip.position.set(sx * (p.A + 0.15), p.y0 + p.L + 0.35, sz * (p.B + 0.15));
    tip.rotation.set(-sz * 0.6, 0, sx * 0.6);
    add(tip, g);
    // 歇山：垂脊沿山花邊緣到正脊
    if (p.gable != null) {
      const vx = sx * (ridgeEndX - 0.02), vp = [];
      for (let t = 0; t <= 24; t++) { const z = sz * (p.B - p.gable * p.B) * (1 - t / 24); vp.push(new THREE.Vector3(vx, roofY(vx, z, p).y + 0.1, z)); }
      ridge(vp);
    }
  }
  if (!cut(0, 0)) {
    // 正脊 + 兩端鴟尾 + 中央寶葫蘆
    const top = p.y0 + p.H;
    box(2 * ridgeEndX + 0.4, 0.5, 0.45, ridgeMat, 0, top + 0.2, 0, g);
    box(2 * ridgeEndX + 0.6, 0.12, 0.55, std({ color: 0xe9e2d2 }), 0, top + 0.5, 0, g);
    for (const sx of [-1, 1]) {
      const curl = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.16, 8, 20, Math.PI * 1.3), ridgeMat);
      curl.position.set(sx * (ridgeEndX + 0.05), top + 1.0, 0);
      curl.rotation.set(0, sx > 0 ? 0 : Math.PI, -0.4);
      add(curl, g);
    }
    const gourd = std({ color: 0xd9a63a, metalness: 0.4, roughness: 0.4 });
    [[0.32, 0.95], [0.22, 1.4], [0.1, 1.7]].forEach(([r, y]) => add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), gourd), g).position.set(0, top + y, 0));
  }
  return g;
}

/* ============================================================
 * 3. 一樓：紅柱迴廊 + 紅牆 + 彩繪橫樑 + 斗拱
 *    目的：還原城樓下層的開放式迴廊
 * ============================================================ */
const F = P.H + 0.35;                              // 城台壓簷頂面高度
const red = std({ color: 0xa82418, roughness: 0.6 });
const whiteStone = std({ color: 0xe6e1d6 });
box(13.6, 0.4, 10.6, whiteStone, 0, F + 0.2, 0, gate);          // 台基
const floorTop = F + 0.4, colH = 3.2;
// 屋頂參數（高度都由一樓地板往上推算）
const lowerRoof = { A: 8.6, B: 6.6, H: 3.8, L: 1.0, y0: floorTop + colH + 0.25, gable: null };
const coreSplit = floorTop + 4.6;                  // 一樓紅牆 / 二樓白牆分界
const upperRoof = { A: 7.6, B: 5.6, H: 4.0, L: 1.3, y0: coreSplit + 3.1, gable: 0.55 };
const upperTop = upperRoof.y0 + 0.9;               // 二樓牆頂（藏在屋頂內）
const colX = [-6, -3.6, -1.2, 1.2, 3.6, 6], sideZ = [-1.5, 1.5];
const colPos = [];
colX.forEach(x => { colPos.push([x, 4.5], [x, -4.5]); });
sideZ.forEach(z => { colPos.push([6, z], [-6, z]); });
const colGeo = new THREE.CylinderGeometry(0.22, 0.25, colH, 18);
const baseGeo = new THREE.CylinderGeometry(0.36, 0.4, 0.3, 12);
for (const [x, z] of colPos) {
  add(new THREE.Mesh(colGeo, red), gate).position.set(x, floorTop + colH / 2, z);
  add(new THREE.Mesh(baseGeo, whiteStone), gate).position.set(x, floorTop + 0.15, z);
}
// 內牆（核心殿身）：一樓紅牆門窗，二樓白牆
const core = { hx: 4.2, hz: 3.0 };
{
  const lowF = wallTex({ bays: 5, base: '#8f2618', post: '#6a160d', win: '#3b1a10', lattice: '#a8673a', door: true });
  const lowS = wallTex({ bays: 3, base: '#8f2618', post: '#6a160d', win: '#3b1a10', lattice: '#a8673a' });
  const plain = std({ color: 0x8f2618 });
  const mF = std({ map: lowF }), mS = std({ map: lowS });
  const h = coreSplit - floorTop;
  box(core.hx * 2, h, core.hz * 2, [mS, mS, plain, plain, mF, mF], 0, floorTop + h / 2, 0, gate);

  const upF = wallTex({ bays: 3, base: '#f1ece2', post: '#a82418', win: '#2a201c', lattice: '#6b4a34', winH: [0.25, 0.62], winW: 0.42 });
  const upS = wallTex({ bays: 2, base: '#f1ece2', post: '#a82418', win: '#2a201c', lattice: '#6b4a34', winH: [0.25, 0.62], winW: 0.42 });
  const uF = std({ map: upF }), uS = std({ map: upS });
  const uh = upperTop - coreSplit;
  box(core.hx * 2, uh, core.hz * 2, [uS, uS, plain, plain, uF, uF], 0, coreSplit + uh / 2, 0, gate);
  // 二樓角柱
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, uh, 12), red), gate).position.set(sx * core.hx, coreSplit + uh / 2, sz * core.hz);
}
// 彩繪橫樑（一樓柱頂、二樓簷下）
function beamRing(hx, hz, y, h = 0.55, t = 0.32) {
  const front = beamTex.clone(); front.repeat.set(2, 1); front.wrapS = THREE.RepeatWrapping; front.needsUpdate = true;
  const m = std({ map: front, roughness: 0.6 });
  box(hx * 2 + t, h, t, m, 0, y, hz, gate); box(hx * 2 + t, h, t, m, 0, y, -hz, gate);
  box(t, h, hz * 2 + t, m, hx, y, 0, gate).rotation.y = 0; box(t, h, hz * 2 + t, m, -hx, y, 0, gate);
}
beamRing(6, 4.5, floorTop + colH + 0.05);
beamRing(core.hx + 0.05, core.hz + 0.05, upperRoof.y0 - 0.45, 0.5, 0.3);
// 斗拱：簷下一排小木塊
function brackets(hx, hz, y, step = 0.6) {
  const pts = [];
  for (let x = -hx; x <= hx + 1e-6; x += step) pts.push([x, hz], [x, -hz]);
  for (let z = -hz + step; z < hz - 1e-6; z += step) pts.push([hx, z], [-hx, z]);
  const geo = new THREE.BoxGeometry(0.32, 0.28, 0.32);
  const inst = new THREE.InstancedMesh(geo, std({ color: 0x2b6a5a, roughness: 0.6 }), pts.length * 2);
  const m4 = new THREE.Matrix4(); let k = 0;
  pts.forEach(([x, z]) => {
    m4.makeTranslation(x, y, z); inst.setMatrixAt(k++, m4);
    m4.makeScale(1.4, 0.7, 1.4).setPosition(x * 1.03, y + 0.24, z * 1.03); inst.setMatrixAt(k++, m4);
  });
  inst.castShadow = true;
  gate.add(inst);
}
brackets(6, 4.5, floorTop + colH + 0.45);
brackets(core.hx + 0.05, core.hz + 0.05, upperRoof.y0 - 0.03, 0.55);

/* ============================================================
 * 4. 腰檐（下層屋頂）與 5. 歇山頂（上層屋頂）
 *    目的：做出照片中兩層橘紅瓦、藍色屋脊與起翹的屋頂
 * ============================================================ */
gate.add(buildRoof(lowerRoof, (x, z) => Math.abs(x) < core.hx + 0.02 && Math.abs(z) < core.hz + 0.02));
gate.add(buildRoof(upperRoof));

/* ============================================================
 * 6. 燈籠：掛在上下層簷下
 *    目的：照片中簷下一串白色燈籠是很重要的特徵
 * ============================================================ */
{
  const body = std({ color: 0xf4efe4, emissive: 0x332a18, roughness: 0.5 });
  const cap = std({ color: 0x9a2418 });
  const string = new THREE.MeshBasicMaterial({ color: 0x333333 });
  function lantern(x, z, roof) {
    const top = roofY(x, z, roof).y - 0.05, y = top - 1.0;
    const g = new THREE.Group();
    add(new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), body), g).scale.set(1, 1.35, 1);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 12), cap), g).position.y = 0.37;
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 12), cap), g).position.y = -0.37;
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, top - y - 0.4), string), g, false).position.y = 0.4 + (top - y - 0.4) / 2;
    const tas = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 0.25, 6), cap); tas.position.y = -0.52; g.add(tas);
    g.position.set(x, y, z);
    gate.add(g);
  }
  [-4.8, -2.4, 0, 2.4, 4.8].forEach(x => { lantern(x, 5.3, lowerRoof); lantern(x, -5.3, lowerRoof); });
  [-2.25, 0, 2.25].forEach(z => { lantern(7.0, z, lowerRoof); lantern(-7.0, z, lowerRoof); });
  [-3, 0, 3].forEach(x => { lantern(x, 4.0, upperRoof); lantern(x, -4.0, upperRoof); });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) { lantern(sx * 7.3, sz * 5.4, lowerRoof); lantern(sx * 5.4, sz * 4.1, upperRoof); }
}

/* ============================================================
 * 7. 周邊環境：廣場、圓環道路、鐵鍊護欄、石椅、樹、遠處樓房
 *    目的：讓模型有照片中「城市圓環裡的古城門」的氛圍
 * ============================================================ */
{
  // 柏油路面
  const asphalt = canvasTex(256, 256, (g, w, h) => {
    const rnd = mulberry32(11); g.fillStyle = '#6d6f72'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) { const v = 90 + rnd() * 40 | 0; g.fillStyle = `rgb(${v},${v},${v + 3})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  });
  asphalt.repeat.set(60, 60);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), std({ map: asphalt }));
  ground.rotation.x = -Math.PI / 2; add(ground, scene, false, true);

  // 圓環白虛線
  const dashMat = new THREE.MeshBasicMaterial({ color: 0xf2f2f2 });
  for (let i = 0; i < 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const d = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.18), dashMat);
    d.rotation.x = -Math.PI / 2; d.rotation.z = -a; d.position.set(Math.cos(a) * 34, 0.02, Math.sin(a) * 34);
    d.rotation.order = 'XYZ'; d.rotateZ(Math.PI / 2);
    scene.add(d);
  }

  // 廣場鋪面
  const paving = canvasTex(256, 256, (g, w, h) => {
    const rnd = mulberry32(5);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const l = 66 + rnd() * 8; g.fillStyle = `hsl(35,12%,${l}%)`; g.fillRect(x * 32, y * 32, 31, 31); }
  });
  paving.repeat.set(14, 14);
  const plaza = new THREE.Mesh(new THREE.CylinderGeometry(28, 28.3, 0.25, 96), std({ map: paving }));
  plaza.position.y = 0.12; add(plaza, scene, false, true);
  const curb = new THREE.Mesh(new THREE.TorusGeometry(28.2, 0.2, 6, 96), std({ color: 0xd9d4ca }));
  curb.rotation.x = Math.PI / 2; curb.position.y = 0.25; add(curb);

  // 鐵鍊護欄（城台四周）
  const postMat = std({ color: 0xc9c2b4 });
  const chainMat = std({ color: 0x8a8a8a, metalness: 0.6, roughness: 0.4 });
  const ring = [];
  const rx = P.W / 2 + 2.2, rz = P.D / 2 + 2.2;
  for (let x = -rx; x <= rx + 1e-6; x += (2 * rx) / 7) { ring.push([x, rz]); }
  for (let z = rz - (2 * rz) / 6; z >= -rz - 1e-6; z -= (2 * rz) / 6) ring.push([rx, z]);
  for (let x = rx - (2 * rx) / 7; x >= -rx - 1e-6; x -= (2 * rx) / 7) ring.push([x, -rz]);
  for (let z = -rz + (2 * rz) / 6; z < rz - 1e-6; z += (2 * rz) / 6) ring.push([-rx, z]);
  ring.forEach(([x, z], i) => {
    const isGap = Math.abs(x) < 3 && Math.abs(z) > rz - 0.1;     // 拱門前後留出入口
    box(0.18, 0.9, 0.18, postMat, x, 0.7, z);
    const [nx, nz] = ring[(i + 1) % ring.length];
    if (isGap || (Math.abs(nx) < 3 && Math.abs(nz) > rz - 0.1)) return;
    const a = new THREE.Vector3(x, 1.05, z), b = new THREE.Vector3(nx, 1.05, nz);
    const mid = a.clone().lerp(b, 0.5); mid.y -= 0.35;
    add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 16, 0.025, 4), chainMat), scene, true, false);
  });

  // 石椅（木頭座面）
  const benchStone = std({ color: 0xcfc6b5 });
  const wood = std({ color: 0xb98a55, roughness: 0.7 });
  [[-15, 14, 0.5], [15, 14, -0.5], [-20, 3, 1.4], [20, 3, -1.4], [-6, 17, 0], [6, 17, 0]].forEach(([x, z, r]) => {
    const g = new THREE.Group(); g.position.set(x, 0.25, z); g.rotation.y = r;
    box(4.5, 0.5, 1.2, benchStone, 0, 0.25, 0, g);
    box(4.6, 0.12, 1.3, wood, 0, 0.56, 0, g);
    scene.add(g);
  });

  // 樹
  const rnd = mulberry32(21);
  const trunk = std({ color: 0x6b4b33 });
  const leafMats = [0x3f7a35, 0x4f8a3a, 0x356b2f].map(c => std({ color: c, roughness: 0.9 }));
  function tree(x, z, s = 1) {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3, 8), trunk), g).position.y = 1.5;
    for (let k = 0; k < 6; k++) {
      const m = add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.2 + rnd() * 0.8, 1), leafMats[k % 3]), g);
      m.position.set((rnd() - .5) * 2.4, 3.6 + rnd() * 1.6, (rnd() - .5) * 2.4);
    }
    scene.add(g);
  }
  function palm(x, z, h = 10) {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.35, h, 8), std({ color: 0x8b7a63 })), g).position.y = h / 2;
    for (let k = 0; k < 9; k++) {
      const leaf = add(new THREE.Mesh(new THREE.ConeGeometry(0.45, 4, 4), leafMats[k % 3]), g);
      const a = k / 9 * Math.PI * 2;
      leaf.position.set(Math.cos(a) * 1.6, h - 0.3, Math.sin(a) * 1.6);
      leaf.rotation.set(Math.sin(a) * 1.9, 0, -Math.cos(a) * 1.9);
    }
    scene.add(g);
  }
  [[-24, 10], [-25, -6], [23, 12], [25, -4], [-12, -22], [12, -23], [0, -25], [-22, 18, 0.8], [22, 18, 0.8]].forEach(([x, z, s]) => tree(x, z, s || 1.1));
  palm(19, -14, 11); palm(-18, -15, 9);

  // 遠處街屋
  const bRnd = mulberry32(99);
  const winTex = canvasTex(128, 256, (g, w, h) => {
    g.fillStyle = '#e8e4dc'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#7d8a96';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 3; x++) g.fillRect(10 + x * 40, 10 + y * 32, 28, 18);
  });
  const facadeCols = ['#e8e4dc', '#d9d3c6', '#c9cdd2', '#b5483e', '#d8c7a8'];
  for (let i = 0; i < 46; i++) {
    const a = i / 46 * Math.PI * 2 + bRnd() * 0.05;
    const r = 62 + bRnd() * 22;
    const h = 7 + bRnd() * 14, w = 8 + bRnd() * 8, d = 10 + bRnd() * 6;
    const t = winTex.clone(); t.needsUpdate = true; t.repeat.set(Math.round(w / 4), Math.round(h / 8)); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    const m = std({ map: t, color: facadeCols[i % facadeCols.length] });
    const b = box(w, h, d, m, Math.cos(a) * r, h / 2, Math.sin(a) * r);
    b.lookAt(0, h / 2, 0);
    if (bRnd() < 0.3) { // 招牌
      const sign = box(w * 0.6, 3, 0.3, std({ color: bRnd() < .5 ? 0xc0302a : 0xf5f5f0, emissive: 0x111111 }), 0, 0, 0);
      sign.position.copy(b.position).add(new THREE.Vector3(-Math.cos(a), 0, -Math.sin(a)).multiplyScalar(d / 2 + 0.2));
      sign.position.y = h * 0.6; sign.lookAt(0, sign.position.y, 0);
    }
  }
}

/* ============================================================
 * 8. 視角與互動
 *    目的：預設重現照片的左前方仰角，並提供按鈕切換
 * ============================================================ */
const views = {
  photo: { pos: [-22, 5, 34], target: [1, 10, 0] },
  top: { pos: [32, 48, 40], target: [0, 8, 0] },
};
function setView(v) { camera.position.set(...views[v].pos); controls.target.set(...views[v].target); controls.update(); }
setView('photo');

const btnRotate = document.getElementById('btnRotate');
btnRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; btnRotate.classList.toggle('on', controls.autoRotate); };
document.getElementById('btnPhoto').onclick = () => setView('photo');
document.getElementById('btnTop').onclick = () => setView('top');
controls.autoRotateSpeed = 0.8;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__ready = true;
</script>
</body>
</html>
